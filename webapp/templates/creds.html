{% extends "base.html" %}{% block title %}Credentials{% endblock %}
{% block body %}
<div class="card" style="max-width:560px">
  <h2>cTrader credentials</h2>
  <p class="mut">Secrets are <strong>encrypted at rest</strong>. Fields left blank keep the current value.
     Client id/secret are optional — leave blank to use the platform's global Open API app.</p>
  <form method="post" action="/creds">
    <label>Client ID (optional)</label>
    <input name="client_id" value="{{ user.ctrader_client_id or '' }}" style="width:100%">
    <label>Client Secret {% if has_secret %}<span class="pill on">set</span>{% endif %}</label>
    <input name="client_secret" type="password" placeholder="•••• (unchanged)" style="width:100%">
    <label>Access Token (OAuth) {% if has_token %}<span class="pill on">set</span>{% else %}<span class="pill off">not set</span>{% endif %}</label>
    <input name="access_token" type="password" placeholder="•••• (unchanged)" style="width:100%">
    <div style="margin-top:16px"><button>Save</button></div>
  </form>
</div>
{% endblock %}
