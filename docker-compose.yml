# Docker/Ofelia scaffold: ONE static Ofelia job, forever -- see
# docs/DEV_PLANS.md's "Multi-account Docker migration" decisions. Run
# `docker compose`/`podman compose` from the repo root (uses ${PWD} for
# bind-mount paths below).
#
# `worker` only describes the image build -- `docker compose up` does NOT
# start it (profile gate below); Ofelia's job-run spins up a short-lived
# container from `algo-worker:latest` once a minute, running
# `scripts/scheduler_tick.py` (see that module's docstring). THAT script,
# not this file, decides which strategy/task is actually due this minute by
# reading deployment/schedule.yml -- so adding a strategy's schedule or a
# background task is a schedule.yml edit, never a docker-compose.yml edit.
# `webapp.runner --strategy S007` still runs as a plain subprocess INSIDE
# that same container (not a separate container-per-strategy), which is why
# the mounts/env below live on this one job, not on a per-strategy label.
#
# Only S007 has an entry in deployment/schedule.yml so far -- webapp/runner.py
# itself is still S007/CTRADER-only today; generalizing its dispatch to other
# strategies is a separate follow-up. Do not `docker compose up -d ofelia`
# unattended while the legacy launchd job `com.anton.algo.s007bot` is also
# loaded: both would drive the same demo account (ctrader-47939312)
# independently.

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: algo-worker:latest
    profiles: ["build-only"]   # excluded from `up`/`start` by default

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    environment:
      - TZ=Europe/Kyiv   # S007's session window (bot/s007_config.py) is local Kyiv time
    # --- Podman machine (Fedora CoreOS + SELinux enforcing) specifics ---
    # Verified live on this host (2026-08-08). Plain Docker Engine/Desktop
    # would instead just need `- /var/run/docker.sock:/var/run/docker.sock:ro`
    # with no security_opt -- both quirks below are Podman-machine-only:
    #   1. rw, not ro: job-run needs to CREATE/start/remove containers via
    #      this socket, not just list them -- a read-only mount 403s on the
    #      create call.
    #   2. /run/podman/podman.sock (the socket AS SEEN INSIDE the podman-
    #      machine VM), not the macOS-side /var/run/docker.sock forward --
    #      the latter is a symlink chain that resolves outside the VM's
    #      virtiofs-shared paths, so bind-mounting it into a container
    #      running INSIDE the VM fails at the mount step.
    #   3. security_opt label=disable: without it, connecting to the
    #      bind-mounted socket fails with "permission denied" even as root
    #      in the container -- an SELinux AVC denial (Fedora CoreOS is
    #      enforcing by default), not a Unix file-permission issue; `:z`
    #      relabeling alone did not clear it in testing, disabling SELinux
    #      confinement for this one (trusted, local-only) container did.
    security_opt:
      - label=disable
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:rw
    labels:
      ofelia.enabled: "true"
      # 6-field cron, SECONDS FIRST (sec min hour dom month dow) -- verified
      # empirically against the actual pulled mcuadros/ofelia:latest image
      # (2026-08-08): its README claims 0.4.x+ made seconds optional, but
      # this image fires "* * * * *" (5 fields) EVERY SECOND, not every
      # minute -- only a leading seconds field ("0 * * * * *") gives the
      # intended once-a-minute cadence. Do not "simplify" this back to 5
      # fields without re-verifying live (see `podman run ... daemon
      # --docker` + watch `Started -` log lines) -- the doc and the shipped
      # image disagree here.
      #
      # This is Ofelia's OWN outer schedule (Go robfig/cron, 6-field) and is
      # entirely separate from deployment/schedule.yml's per-strategy/task
      # cron strings, which stay standard 5-field (min hour dom month dow) --
      # those are parsed by Python's `croniter` inside
      # scripts/scheduler_tick.py, a different library with a different
      # field count. Don't copy one format into the other.
      ofelia.job-run.dispatch.schedule: "0 * * * * *"
      ofelia.job-run.dispatch.image: "algo-worker:latest"
      ofelia.job-run.dispatch.command: "python -m scripts.scheduler_tick"
      ofelia.job-run.dispatch.delete: "true"
      # Multi-value fields need a JSON array (Ofelia label syntax, not compose's).
      ofelia.job-run.dispatch.volume: >-
        ["${PWD}/data:/app/data:rw", "${PWD}/reports:/app/reports:rw"]
      ofelia.job-run.dispatch.environment: >-
        ["APP_SECRET_KEY=${APP_SECRET_KEY}", "APP_DB_URL=sqlite:////app/data/app.db"]
