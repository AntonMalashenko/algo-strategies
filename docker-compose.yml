# Docker/Ofelia scaffold: ONE static Ofelia job, forever -- see
# docs/DEV_PLANS.md's "Multi-account Docker migration" decisions. Run
# `docker compose`/`podman compose` from the repo root (uses ${PWD} for
# bind-mount paths below).
#
# `worker` only describes the image build -- `docker compose up` does NOT
# start it (profile gate below); Ofelia's job-run spins up a short-lived
# container from `algo-worker:latest` once a minute, running
# `scripts/scheduler_tick.py` (see that module's docstring). THAT script,
# not this file, decides which strategy/task is actually due this minute by
# reading deployment/schedule.yml -- so adding a strategy's schedule or a
# background task is a schedule.yml edit, never a docker-compose.yml edit.
# `webapp.runner --strategy S007` still runs as a plain subprocess INSIDE
# that same container (not a separate container-per-strategy), which is why
# the mounts/env below live on this one job, not on a per-strategy label.
#
# Cutover from the legacy single-account launchd job (com.anton.algo.s007bot)
# to this path happened 2026-08-09; as of 2026-08-10 that job's plist is no
# longer installed in ~/Library/LaunchAgents/ at all (previously just
# unloaded, which still left it one `launchctl load` away from an accident --
# see scripts/s007_tick.py's module docstring) -- this Ofelia job is now the
# ONLY thing that can drive S007 (demo account ctrader-47939312). If you ever
# need to fall back: `docker compose down ofelia` FIRST, then
# `cp scripts/com.anton.algo.s007bot.plist ~/Library/LaunchAgents/ &&
# launchctl load ~/Library/LaunchAgents/com.anton.algo.s007bot.plist` --
# never run both at once, they would drive the same account independently.
# S009 is scheduled
# here too (deployment/schedule.yml) but stays shadow-only (broker="off"
# hardcoded in webapp/runner.py's _worker_s009) -- no cutover decision
# needed there, it was never live through any path.
# `restart: unless-stopped` below: survive a Podman machine/host restart --
# this replaces launchd's RunAtLoad, without it a reboot would silently stop
# trading until someone noticed and ran `docker compose up -d ofelia` again.

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: algo-worker:latest
    profiles: ["build-only"]   # excluded from `up`/`start` by default
    # Only takes effect if `worker` is ever started via compose directly
    # (it normally isn't -- see header). The REAL per-tick worker containers
    # are created straight through the podman socket by ofelia, and get the
    # `algo` network from the `ofelia.job-run.dispatch.network` label below.
    networks:
      - algo

  # ALGODEV-45 step 2: S007 persistent-session OBSERVATION daemon
  # (scripts/s007_daemon.py) -- containerized 2026-09-23 per Anton's request
  # (manual `python -m scripts.s007_daemon` each time was not sustainable).
  # Unlike `worker` above, this IS a genuine standing compose service, not an
  # Ofelia job-run: the whole point is ONE long-lived cTrader session held
  # open for hours, not a fresh stateless-tick container per minute. Reuses
  # the same `algo-worker:latest` image (no separate build) with `command:`
  # overridden to run the daemon instead of a strategy tick.
  #
  # `restart: unless-stopped` deliberately does NOT contradict the script's
  # own "no auto-reconnect by design" docstring note -- that note is about
  # the in-process Twisted session never silently retrying mid-run (an
  # explicit, observable exit instead), not about whether the daemon should
  # come back at all. A container restart is a coarser, DIFFERENT kind of
  # resilience -- a fresh process/fresh session, same "stateless restart over
  # in-process retry-loop complexity" philosophy the rest of this file
  # already uses -- so it's consistent, not a change to the experiment's own
  # safety invariant (still read-only, still never places an order, see that
  # script's SAFETY INVARIANT comment).
  #
  # account-strategy-id 1 = S007's only registered AccountStrategy row
  # (Bybit/cTrader ctrader-47939312, demo) -- hardcoded here the same way
  # webapp/runner.py's per-strategy dispatch is a property of the deployment,
  # not read from schedule.yml (this daemon is S007-only by the script's own
  # design, see its module docstring).
  s007-daemon:
    image: algo-worker:latest
    command: python -m scripts.s007_daemon --account-strategy-id 1
    restart: unless-stopped
    environment:
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - APP_DB_URL=sqlite:////app/data/app.db
      - TZ=Europe/Kyiv
    volumes:
      - ${PWD}/data:/app/data:rw
      - ${PWD}/reports:/app/reports:rw
    networks:
      - algo

  # Shared Redis -- reachable as `redis://redis:6379` from every job-run
  # worker container (they join the `algo` network via the job-run label
  # below). Deliberately NO `ports:` -- not published to the host (Anton's
  # call, 2026-09-08), so it is reachable only from inside the compose
  # network; a process on the macOS host (the manually-run webapp) cannot
  # see it. Add `ports: ["127.0.0.1:6379:6379"]` here if that ever needs to
  # change.
  #
  # One instance, two roles (see docs/DEV_PLANS.md):
  #   - logical DB 0: durable shared state / distributed locks / pub-sub
  #   - logical DB 1: market-data cache (the parked per-tick M1-bar cache)
  # Hence `--maxmemory-policy noeviction` (a lock key must never be silently
  # evicted) + `--appendonly yes` (survive a restart). Cache entries carry
  # their own per-key TTL rather than leaning on a global LRU. `--maxmemory`
  # is a generous ceiling that makes an overflow fail loudly instead of
  # eating the podman-machine VM's RAM; bump it in this one line if needed.
  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --dir /data
    volumes:
      - redis-data:/data
    networks:
      - algo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    restart: unless-stopped
    environment:
      - TZ=Europe/Kyiv   # S007's session window (bot/s007_config.py) is local Kyiv time
    # --- Podman machine (Fedora CoreOS + SELinux enforcing) specifics ---
    # Verified live on this host (2026-08-08). Plain Docker Engine/Desktop
    # would instead just need `- /var/run/docker.sock:/var/run/docker.sock:ro`
    # with no security_opt -- both quirks below are Podman-machine-only:
    #   1. rw, not ro: job-run needs to CREATE/start/remove containers via
    #      this socket, not just list them -- a read-only mount 403s on the
    #      create call.
    #   2. /run/podman/podman.sock (the socket AS SEEN INSIDE the podman-
    #      machine VM), not the macOS-side /var/run/docker.sock forward --
    #      the latter is a symlink chain that resolves outside the VM's
    #      virtiofs-shared paths, so bind-mounting it into a container
    #      running INSIDE the VM fails at the mount step.
    #   3. security_opt label=disable: without it, connecting to the
    #      bind-mounted socket fails with "permission denied" even as root
    #      in the container -- an SELinux AVC denial (Fedora CoreOS is
    #      enforcing by default), not a Unix file-permission issue; `:z`
    #      relabeling alone did not clear it in testing, disabling SELinux
    #      confinement for this one (trusted, local-only) container did.
    security_opt:
      - label=disable
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:rw
    labels:
      ofelia.enabled: "true"
      # 6-field cron, SECONDS FIRST (sec min hour dom month dow) -- verified
      # empirically against the actual pulled mcuadros/ofelia:latest image
      # (2026-08-08): its README claims 0.4.x+ made seconds optional, but
      # this image fires "* * * * *" (5 fields) EVERY SECOND, not every
      # minute -- only a leading seconds field ("0 * * * * *") gives the
      # intended once-a-minute cadence. Do not "simplify" this back to 5
      # fields without re-verifying live (see `podman run ... daemon
      # --docker` + watch `Started -` log lines) -- the doc and the shipped
      # image disagree here.
      #
      # This is Ofelia's OWN outer schedule (Go robfig/cron, 6-field) and is
      # entirely separate from deployment/schedule.yml's per-strategy/task
      # cron strings, which stay standard 5-field (min hour dom month dow) --
      # those are parsed by Python's `croniter` inside
      # scripts/scheduler_tick.py, a different library with a different
      # field count. Don't copy one format into the other.
      ofelia.job-run.dispatch.schedule: "0 * * * * *"
      ofelia.job-run.dispatch.image: "algo-worker:latest"
      ofelia.job-run.dispatch.command: "python -m scripts.scheduler_tick"
      ofelia.job-run.dispatch.delete: "true"
      # Attach every per-tick worker container to the `algo` network so it
      # can resolve+reach `redis:6379`. Referenced by the literal network
      # name (see the top-level `networks:` block -- `name: algo` there is
      # what keeps this from being project-prefixed); these containers are
      # NOT compose services and never see the project-scoped name.
      ofelia.job-run.dispatch.network: "algo"
      # Multi-value fields need a JSON array (Ofelia label syntax, not compose's).
      ofelia.job-run.dispatch.volume: >-
        ["${PWD}/data:/app/data:rw", "${PWD}/reports:/app/reports:rw"]
      # TZ here (not just on the ofelia service above) matters: this is the
      # container that actually evaluates deployment/schedule.yml's cron
      # strings via croniter against ITS OWN wall clock. Found live
      # 2026-08-10 (S007's first real trading day on this path): without it,
      # the container defaults to UTC, so "* 10-16 * * 1-5" (meant as Kyiv
      # local hours, matching bot/s007_config.py's TRADE_START/EXIT_END) was
      # silently evaluated as UTC 10-16 = Kyiv 13:00-19:59 -- S007 never
      # dispatched during the actual 10:00-12:59 Kyiv part of its session at
      # all, and would have kept firing 17:00-19:59 Kyiv, past its own
      # session end, for no effect (the worker's own in_window check would
      # just no-op there, but still a wasted/confusing extra dispatch).
      ofelia.job-run.dispatch.environment: >-
        ["APP_SECRET_KEY=${APP_SECRET_KEY}", "APP_DB_URL=sqlite:////app/data/app.db", "TZ=Europe/Kyiv", "REDIS_URL=redis://redis:6379"]


networks:
  # Explicitly named (NOT `<project>_algo`) so the Ofelia job-run
  # `network` label above can attach worker containers to it by this exact
  # literal -- those containers are created through the podman socket, not
  # as compose services, so a project-scoped name would not resolve.
  algo:
    name: algo

volumes:
  # Redis AOF + RDB persistence. Podman-managed named volume (correct
  # SELinux context out of the box -- unlike a host bind mount, which is
  # why this is not `${PWD}/...`).
  redis-data:
