# Single source of truth for "what runs, on what cron schedule" -- read by
# scripts/scheduler_tick.py, which Ofelia invokes every minute (see
# docker-compose.yml). Adding/changing a strategy's cadence or a background
# task is a plain edit + code review here, NOT a docker-compose.yml change --
# that file's Ofelia job never needs to change again.
#
# Schedule strings are standard 5-field cron (min hour dom month dow),
# evaluated against the container's local wall-clock time (TZ=Europe/Kyiv,
# set on the ofelia service in docker-compose.yml) -- matches every other
# schedule in this repo (bot/s007_config.py's TRADE_START/EXIT_END are also
# local Kyiv time).

strategies:
  # name must match webapp Strategy.name -- dispatched as
  # `python -m webapp.runner --strategy <name>`, which itself queries the DB
  # for enabled AccountStrategy rows and fans out per account. The schedule
  # here is a property of the STRATEGY (one job per strategy, not per
  # account/user) -- mirrors scripts/s007_tick.py::in_session()'s window
  # (TRADE_START/EXIT_END = "10:00"/"16:59", bot/s007_config.py:111).
  - name: S007
    schedule: "* 10-16 * * 1-5"
  # S009 rebalances at most once a day (a new closed UTC day), but unlike
  # S007's tick this one has NO cheap "already up to date, skip" check
  # before webapp/runner.py -> _worker_s009 -> run_cycle_for_account does a
  # real (public, unauthenticated) Bybit data refresh + full engine
  # recompute -- every invocation, not just the first one that finds new
  # data. Scheduling it every minute like S007 would hammer Bybit's public
  # API 1440x/day for nothing, so this fires once daily instead, shortly
  # after UTC midnight so the just-closed day's funding/kline data has had
  # time to land. Self-healing if a run is missed or the data isn't ready
  # yet: run_cycle_for_account books every day between last_day and the
  # latest available one, not just "yesterday", so the next successful run
  # catches up automatically -- no separate retry schedule needed.
  # Still `broker="off"` hardcoded in _worker_s009 -- shadow-only, no
  # orders, regardless of how often this fires.
  - name: S009
    schedule: "5 0 * * *"

# Background jobs unrelated to any single (account, strategy) pair (data
# refresh, cleanup, ...). `command` is run as-is via subprocess (module path,
# e.g. "python -m scripts.dump_today_m1"). Empty for now -- populate as
# concrete needs come up, not speculatively.
tasks:
  # ALGODEV-9: Deribit BTC+ETH option-board snapshot
  # (scripts/fetch_deribit_snapshot.py, see docs/DERIBIT_OPTIONS_SNAPSHOT.md).
  # Capture-now and watermark-driven (module docstring SS2/SS3.4): a missed
  # day can never be backfilled, so this is scheduled once daily, not on a
  # retry cadence -- a transient failure (exit 1) just leaves the watermark
  # untouched and waits for tomorrow's run, same as the script's own retry
  # story.
  #
  # Target: fire at/after 16:00 UTC (spec SS3.4 -- the reference weekly
  # short-strangle construction's Friday-16:00-UTC entry, S012 candidate).
  # This cron is a LOCAL hour, matching the file header above (evaluated
  # against the container's Europe/Kyiv wall clock) -- picked for the
  # CURRENT summer offset (EEST, UTC+3): 19:00 local = 16:00 UTC. Because
  # it's the UTC *offset* that changes at the DST boundary, not the local
  # clock, a fixed local hour drifts in UTC terms once DST ends: in winter
  # (EET, UTC+2) this same "0 19 * * *" fires at 17:00 UTC instead of
  # 16:00 -- one hour later, still same-day and still watermark-safe, but
  # a real one-hour drift from the SS3.4 target that needs a manual edit
  # here (or a different mechanism -- discuss with Anton) at each DST
  # transition if the exact UTC hour ever needs to be tighter than this.
  - name: deribit_snapshot
    command: python -m scripts.fetch_deribit_snapshot
    schedule: "0 19 * * *"
