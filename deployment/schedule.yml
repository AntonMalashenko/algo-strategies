# Single source of truth for "what runs, on what cron schedule" -- read by
# scripts/scheduler_tick.py, which Ofelia invokes every minute (see
# docker-compose.yml). Adding/changing a strategy's cadence or a background
# task is a plain edit + code review here, NOT a docker-compose.yml change --
# that file's Ofelia job never needs to change again.
#
# Schedule strings are standard 5-field cron (min hour dom month dow),
# evaluated against the container's local wall-clock time (TZ=Europe/Kyiv,
# set on the ofelia service in docker-compose.yml) -- matches every other
# schedule in this repo (bot/s007_config.py's TRADE_START/EXIT_END are also
# local Kyiv time).
#
# An entry may opt out of that with an optional `tz:` key (e.g. `tz: UTC`),
# added 2026-09-22 (scripts/scheduler_tick.py::_effective_now(),
# decisions-log.md 2026-09-22) for strategies whose OWN session anchor is
# NOT Kyiv-local (S021's is fixed-EST/UTC) and would otherwise need either a
# hand-maintained seasonal offset or a padded-wide window to survive Kyiv's
# own DST twice a year. Every entry without a `tz:` key -- which as of
# 2026-09-22 is every entry except S021 -- is completely unaffected; don't
# add `tz:` to S007/S009/S011/watchdog/deribit_snapshot without a reason as
# strong as S021's (S007 in particular: its Kyiv anchor is a deliberate,
# zero-drift proxy for Frankfurt/DAX local time, not something to "fix").

strategies:
  # name must match webapp Strategy.name -- dispatched as
  # `python -m webapp.runner --strategy <name>`, which itself queries the DB
  # for enabled AccountStrategy rows and fans out per account. The schedule
  # here is a property of the STRATEGY (one job per strategy, not per
  # account/user) -- scripts/s007_tick.py::in_session() derives its window
  # from bot/s007_config.py's TRADE_START/EXIT_END ("10:00"/"14:24" since the
  # 2026-09-02 ALGODEV-37 cutover to the news-safe MAX8_BE05 preset). The
  # cron hours below are deliberately WIDER (until 16:59): a cycle after
  # EXIT_END is a cheap flatten/no-op, and the slack means a clock/config
  # drift can't leave positions unflattened.
  - name: S007
    schedule: "* 10-16 * * 1-5"
  # S009 rebalances at most once a day (a new closed UTC day). It has a
  # cheap "already up to date, skip" check (added 2026-08-18, see
  # decisions-log.md same date, bot/s009_paper.py::run_cycle_for_account)
  # before webapp/runner.py -> _worker_s009 -> run_cycle_for_account does a
  # real (public, unauthenticated) Bybit data refresh + full engine
  # recompute -- so most invocations that find nothing new are a free,
  # network-free no-op. That is what lets this fire every 15 minutes
  # instead of once daily: a missed exact cron slot (Ofelia/container down
  # at 00:05) used to strand the account un-rebalanced until the NEXT
  # day's single slot or a manual run -- plain cron has no "catch up on a
  # missed minute" behavior, unlike the old macOS launchd
  # StartCalendarInterval design (scripts/s009_tick.py's module docstring).
  # Self-healing once it DOES fire: run_cycle_for_account books every day
  # between last_day and the latest available one, not just "yesterday",
  # so it catches up on however many days were actually missed.
  # `broker_mode` is a per-account_strategy DB row (see
  # webapp/schemas/enums.py::BrokerMode, _worker_s009's own docstring), NOT
  # a hardcoded default here -- Bybit-algo009's row has been "execute"
  # since 2026-08-13, so this DOES place real mainnet orders; it is not
  # shadow-only. Tune the 15-minute cadence in this one line if a faster
  # or slower self-heal window is wanted -- no code change needed.
  - name: S009
    schedule: "*/15 * * * *"
  # S011 (RSI(2)-portfolio) rebalances at most once a day, like S009, but
  # its "day" boundary is the cTrader broker's own D1 bar close across a
  # MIXED universe (indices + FX + gold + 2 crypto CFDs, all on the same
  # CTRADER account -- see bot/s011_paper.py's module docstring for the
  # full "one fixed local-time cutover" reasoning and its documented
  # deviation from the Yahoo-sourced backtest's per-instrument
  # exchange-session boundaries). 22:05 (container-local, Europe/Kyiv --
  # see the file header note above) is chosen to fire after essentially
  # every included market's own session has closed for the day (European
  # index sessions by ~17:30 UTC, NYSE/NASDAQ by ~21:00 UTC winter/~20:00
  # UTC summer) -- crypto legs simply get no signal check on weekends,
  # same as every other asset in this universe, which prints no weekend
  # bars either.
  #
  # NOTE this comment previously said "still broker_mode='off' by default
  # -- shadow-only" -- that went stale: AccountStrategy row for the
  # ctrader-48354548 account has been broker_mode="execute" since
  # 2026-08-19, i.e. this DOES place real orders. `broker_mode` is still a
  # per-account_strategy DB row (see webapp/schemas/enums.py::BrokerMode),
  # not a hardcoded default here -- do not assume shadow-only from this
  # file alone.
  #
  # Like S009 (see that entry's comment above, and decisions-log.md
  # 2026-08-18), a single once-daily cron slot has NO resilience to a
  # missed minute -- and S011 was actually WORSE off than S009 was
  # pre-fix, because run_cycle_for_account had no "already done today"
  # state check at all (fixed 2026-08-21, see decisions-log.md same date,
  # bot/s011_paper.py::_expected_last_closed_trading_date +
  # run_cycle_for_account's up-to-date pre-check) -- confirmed in
  # practice: the account went un-rebalanced all of 2026-08-20 (a normal
  # weekday) after a missed 22:05 slot, and only caught up 2026-08-21 via
  # a manual on-demand run, not the scheduler. Same fix, same shape as
  # S009: a cheap, network-free up-to-date check (this one also skips
  # importing the cTrader SDK module entirely on a no-op tick) lets this
  # fire every 15 minutes on weekdays instead of once daily, so a missed
  # exact-minute trigger self-heals within ~15 minutes instead of a full
  # trading day.
  #
  # UPDATE 2026-09-09: _expected_last_closed_trading_date is now computed in
  # UTC against the broker's own D1 close (bot/s011_paper.py::
  # BROKER_DAY_CLOSE_UTC_HOUR), so that check no longer depends on this
  # container's Europe/Kyiv wall clock -- only the cron line above does.
  - name: S011
    schedule: "*/15 * * * 1-5"

  # S021 (ORB Nasdaq 100) session is anchored to a FIXED EST clock (UTC-5,
  # no DST -- strategy-passport-S021.md sec 0/2, ALGODEV-46): 09:30-15:59 EST
  # is a FIXED 14:30-20:59 UTC window, year-round, never shifting. Unlike
  # S007 above, there is no Kyiv-Frankfurt DST synchronization to lean on
  # here (S021 trades a US index, not DAX) -- so rather than either (a)
  # hand-editing a Kyiv-local cron line at each of Kyiv's own DST transitions
  # (the still-unsolved problem the deribit_snapshot entry below documents),
  # or (b) the interim fix used here 2026-09-22..2026-09-22 (a wide
  # 16:00-23:59 Kyiv-local window sized to cover both DST regimes), this
  # entry now opts into `tz: UTC` (see file header, scripts/scheduler_tick.py
  # ::_effective_now(), decisions-log.md 2026-09-22) and states its window
  # directly in the strategy's own, never-drifting timezone: 14:00-20:59
  # UTC, i.e. the 30 minutes before session open through session close,
  # exact and stable forever -- no seasonal padding needed anymore. Cheap
  # over-polling in the first 30 min is kept anyway as the same harmless
  # slack S007 uses (bot/orb_signals.py::decide() gates on the latest M1
  # bar's OWN fixed-EST timestamp, never this container's wall clock, so a
  # cycle before/after the true session is a no-op either way).
  - name: S021
    schedule: "* 14-20 * * 1-5"
    tz: UTC

# Background jobs unrelated to any single (account, strategy) pair (data
# refresh, cleanup, ...). `command` is run as-is via subprocess (module path,
# e.g. "python -m scripts.dump_today_m1"). Empty for now -- populate as
# concrete needs come up, not speculatively.
tasks:
  # ALGODEV-9: Deribit BTC+ETH option-board snapshot
  # (scripts/fetch_deribit_snapshot.py, see docs/DERIBIT_OPTIONS_SNAPSHOT.md).
  # Capture-now and watermark-driven (module docstring SS2/SS3.4): a missed
  # day can never be backfilled, so this is scheduled once daily, not on a
  # retry cadence -- a transient failure (exit 1) just leaves the watermark
  # untouched and waits for tomorrow's run, same as the script's own retry
  # story.
  #
  # Target: fire at/after 16:00 UTC (spec SS3.4 -- the reference weekly
  # short-strangle construction's Friday-16:00-UTC entry, S013 candidate).
  # This cron is a LOCAL hour, matching the file header above (evaluated
  # against the container's Europe/Kyiv wall clock) -- picked for the
  # CURRENT summer offset (EEST, UTC+3): 19:00 local = 16:00 UTC. Because
  # it's the UTC *offset* that changes at the DST boundary, not the local
  # clock, a fixed local hour drifts in UTC terms once DST ends: in winter
  # (EET, UTC+2) this same "0 19 * * *" fires at 17:00 UTC instead of
  # 16:00 -- one hour later, still same-day and still watermark-safe, but
  # a real one-hour drift from the SS3.4 target that needs a manual edit
  # here (or a different mechanism -- discuss with Anton) at each DST
  # transition if the exact UTC hour ever needs to be tighter than this.
  - name: deribit_snapshot
    command: python -m scripts.fetch_deribit_snapshot
    schedule: "0 19 * * *"
  # scripts/position_audit.py (2026-09-24, Anton's explicit ask after S021
  # left a position open overnight -- see that script's own module
  # docstring for the incident and why S007/S021 specifically are in
  # scope, S009/S011 are not). Runs shortly BEFORE each strategy's own
  # session opens and closes anything still open at that moment -- the
  # script's own safety invariant is "any open position before session
  # start is stale by construction", so timing this task ahead of the
  # session open (not just "every morning") is what makes that invariant
  # true; do not move either entry to fire AFTER its strategy's own
  # session has started.
  #
  # Hardcodes --account-strategy-id (1 for S007, 5 for S021) rather than
  # dispatching by strategy name like the `strategies:` entries above --
  # there is exactly one AccountStrategy row for each right now. Revisit
  # (generalize to "one task per enabled row of this strategy", mirroring
  # webapp/runner.py's own per-strategy fan-out) if either ever gets a
  # second account.
  - name: s007_position_audit
    command: python -m scripts.position_audit --account-strategy-id 1
    schedule: "55 9 * * 1-5"          # 09:55 Kyiv, 5min before S007's 10:00 open
  - name: s021_position_audit
    command: python -m scripts.position_audit --account-strategy-id 5
    schedule: "55 13 * * 1-5"         # 13:55 UTC, 5min before S021's 14:00 UTC open
    tz: UTC
  # ALGODEV-45 step 1: S007 stall watchdog (scripts/s007_watchdog.py). Reads
  # AccountStrategy.last_cycle_at only -- never touches the broker, never
  # kills/restarts anything (there is nothing persistent to manage yet;
  # that's step 2/3 of that ticket). Every 2 minutes, same "* 10-16 * * 1-5"
  # window as the S007 entry above -- no point checking for a stalled S007
  # tick outside the hours a tick is even expected. Alerts land in
  # data/watchdog_alerts.log (normally empty) and, for context, that day's
  # events-<date>.jsonl.
  - name: s007_watchdog
    command: python -m scripts.s007_watchdog
    schedule: "*/2 10-16 * * 1-5"
